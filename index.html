<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓台機票雷達</title>
<style>
  /* 版面:頂部操作列 + 價格矩陣(列=日期、欄=進出點、格=最低價),點格子看該組合所有航班 */
  :root{
    --bg:#f5f6f9; --surface:#fff; --surface-2:#eef1f6; --line:#dde2ec;
    --fg:#1a2230; --muted:#5d677a; --accent:#2f5bd0; --accent-soft:#e7edfc;
    --good:#0f8a5f; --good-soft:#d6f0e3; --good-mid:#eef7f1;
    --font:"IBM Plex Sans",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#11151c; --surface:#1a212b; --surface-2:#222b38; --line:#313c4b;
    --fg:#e8ecf3; --muted:#9aa6b8; --accent:#6c93f5; --accent-soft:#1f2d4d;
    --good:#35c489; --good-soft:#18402f; --good-mid:#15241d; color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#11151c; --surface:#1a212b; --surface-2:#222b38; --line:#313c4b;
    --fg:#e8ecf3; --muted:#9aa6b8; --accent:#6c93f5; --accent-soft:#1f2d4d;
    --good:#35c489; --good-soft:#18402f; --good-mid:#15241d; color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}

  header.bar{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);}
  .bar-inner{padding-block:12px;display:flex;flex-direction:column;gap:11px;}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  h1{font-size:1.15rem;font-weight:700;margin:0;}
  .updated{font-size:.76rem;color:var(--muted);font-family:var(--mono);}
  .controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .seg button{font:inherit;font-weight:600;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;}
  details.dd{position:relative;}
  details.dd>summary{list-style:none;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;white-space:nowrap;}
  details.dd>summary::-webkit-details-marker{display:none;}
  details.dd>summary::after{content:" ▾";color:var(--muted);}
  details.dd[open]>summary{border-color:var(--accent);color:var(--accent);}
  .panel{position:absolute;z-index:30;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px;min-width:210px;max-height:320px;overflow:auto;}
  .panel label{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:400;padding:5px 4px;cursor:pointer;color:var(--fg);}
  .panel .row{display:flex;gap:8px;align-items:center;}
  .panel .mini{font-size:.76rem;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 4px;}
  select{font:inherit;font-size:.85rem;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;}
  .inlinechk{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;}

  main{padding-block:16px 48px;}
  .note{font-size:.78rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:12px;}
  .hint{font-size:.82rem;color:var(--muted);margin:2px 2px 10px;}

  .matwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch;}
  table.mat{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%;}
  table.mat th,table.mat td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 11px;text-align:center;white-space:nowrap;}
  table.mat thead th{background:var(--surface-2);font-size:.75rem;color:var(--muted);font-weight:600;position:sticky;top:0;}
  table.mat .corner{position:sticky;left:0;z-index:5;background:var(--surface-2);text-align:left;font-size:.72rem;}
  table.mat tbody th.rowh{position:sticky;left:0;z-index:4;background:var(--surface);text-align:left;font-family:var(--mono);font-size:.8rem;font-weight:600;}
  td.cell{cursor:pointer;font-family:var(--mono);font-size:.86rem;}
  td.cell .p{font-weight:700;}
  td.cell .al{display:block;font-size:.66rem;color:var(--muted);font-family:var(--font);margin-top:1px;}
  td.cell.rowmin .p{color:var(--good);}
  td.cell.gmin{background:var(--good-soft);}
  td.cell.gmin .p{color:var(--good);}
  td.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;}
  td.cell.empty{color:var(--muted);cursor:default;}
  td.cell:hover:not(.empty){background:var(--accent-soft);}

  .detail{margin-top:18px;}
  .detail h2{font-size:.98rem;margin:0 0 8px;}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
  table.list{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  table.list th,table.list td{text-align:left;padding:9px 11px;white-space:nowrap;font-size:.85rem;}
  table.list thead th{background:var(--surface-2);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);}
  table.list tbody tr+tr td{border-top:1px solid var(--line);}
  td.price{font-family:var(--mono);font-weight:700;}
  td.num{font-family:var(--mono);color:var(--muted);}
  .d0{color:var(--good);font-weight:600;}
  .tag{font-size:.68rem;font-weight:700;color:var(--good);border:1px solid var(--good);border-radius:5px;padding:0 5px;margin-left:6px;}
  .empty{padding:24px;color:var(--muted);text-align:center;font-size:.9rem;}
  .loading{padding:50px 0;text-align:center;color:var(--muted);}
  @media (max-width:480px){ h1{font-size:1.05rem;} table.mat th,table.mat td{padding:7px 8px;} }
</style>

<header class="bar">
  <div class="wrap bar-inner">
    <div class="titlerow"><h1>韓台機票雷達</h1><span class="updated" id="updated">—</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="行程類型">
        <button id="btn-rt" aria-pressed="true">來回</button>
        <button id="btn-ow" aria-pressed="false">單程</button>
      </div>
      <details class="dd" id="dd-air"><summary>航空</summary>
        <div class="panel">
          <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:4px;">
            <button class="mini" id="air-all">全選</button><button class="mini" id="air-none">全不選</button>
          </div>
          <div id="air-list"></div>
        </div>
      </details>
      <details class="dd" id="dd-time"><summary>起飛時段</summary>
        <div class="panel"><div class="row"><select id="fromh"></select><span>–</span><select id="toh"></select></div></div>
      </details>
      <label class="inlinechk"><input type="checkbox" id="direct"> 只看直達</label>
    </div>
  </div>
</header>

<main class="wrap" id="main"><div class="loading">載入航班資料中…</div></main>

<script>
const FMT=n=>(n==null)?"官網查":"NT$"+n.toLocaleString("en-US");
const K=n=>n>=1000?Math.round(n/100)/10+"k":n; // 矩陣用精簡顯示
const hhmm=m=>m==null?"—":String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const durtxt=m=>m==null?"—":(m>=60?Math.floor(m/60)+"h"+(m%60?String(m%60).padStart(2,"0"):""):m+"m");
const mmdd=s=>s?s.slice(5):s;
const splitRoute=r=>{const p=r.split(/[⇄→]/);return[p[0]||"?",p[1]||"?"];};

let DATA=null, trip="round-trip";
const state={direct:false,fromh:0,toh:24,off:new Set()};
let sel=null; // 選中的 {dateKey, route}

const dateKey=r=>trip==="round-trip"?r.out_date+"→"+r.ret_date:r.out_date;
const dateLabel=k=>trip==="round-trip"?(()=>{const[o,r]=k.split("→");return mmdd(o)+" → "+mmdd(r);})():mmdd(k);

function airlinesOf(rows){return [...new Set(rows.map(r=>r.airline))].sort();}
function pass(r){
  if(state.direct&&r.stops!==0)return false;
  if(state.off.has(r.airline))return false;
  if(r.dep_min!=null&&(r.dep_min<state.fromh*60||r.dep_min>state.toh*60))return false;
  return true;
}

function buildHourSelects(){
  const f=document.getElementById("fromh"),t=document.getElementById("toh");
  for(let h=0;h<=24;h++){f.add(new Option(String(h).padStart(2,"0")+":00",h));t.add(new Option(String(h).padStart(2,"0")+":00",h));}
  f.value=0;t.value=24;
  f.onchange=()=>{state.fromh=+f.value;render();};
  t.onchange=()=>{state.toh=+t.value;render();};
}
function buildAirlines(){
  const list=document.getElementById("air-list");list.innerHTML="";
  airlinesOf(DATA[trip]||[]).forEach(a=>{
    const lab=document.createElement("label");
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=!state.off.has(a);
    cb.onchange=()=>{cb.checked?state.off.delete(a):state.off.add(a);updateAirSummary();render();};
    lab.appendChild(cb);lab.appendChild(document.createTextNode(a));list.appendChild(lab);
  });
  updateAirSummary();
}
function updateAirSummary(){
  const all=airlinesOf(DATA[trip]||[]);const on=all.filter(a=>!state.off.has(a)).length;
  document.querySelector("#dd-air>summary").textContent=on===all.length?"航空":`航空(${on}/${all.length})`;
}

function render(){
  const main=document.getElementById("main");main.innerHTML="";
  const note=document.createElement("div");note.className="note";
  note.textContent="價格為 Google Flights 參考價(可能來自第三方平台),訂票前請至航空公司官網確認。清單頁不含航班編號。";
  main.appendChild(note);

  const rows=(DATA[trip]||[]).filter(pass);
  if(!rows.length){const e=document.createElement("div");e.className="empty";e.textContent="沒有符合條件的航班,試著放寬篩選。";main.appendChild(e);return;}

  // 蒐集 日期(列) 與 進出點(欄),計算每格最低價
  const dates=[...new Set(rows.map(dateKey))].sort();
  const routes=[...new Set(rows.map(r=>r.route))].sort();
  const cell={}; // key: date|route -> {price, airline}
  rows.forEach(r=>{
    const k=dateKey(r)+"|"+r.route;const cur=cell[k];
    // 優先採用有價格的最低價;若該格全部無價格,則保留一筆(顯示「官網查」)
    if(!cur){cell[k]={price:r.price,airline:r.airline};}
    else if(r.price!=null&&(cur.price==null||r.price<cur.price)){cell[k]={price:r.price,airline:r.airline};}
  });
  const allPrices=Object.values(cell).map(c=>c.price).filter(p=>p!=null);
  const gmin=allPrices.length?Math.min(...allPrices):Infinity;

  const hint=document.createElement("div");hint.className="hint";
  hint.innerHTML=`列=日期、欄=進出點,格內為該組合<b>最低價</b>(綠色=全場最低)。點任一格看該組合所有航班。`;
  main.appendChild(hint);

  const mw=document.createElement("div");mw.className="matwrap";
  const t=document.createElement("table");t.className="mat";
  // 表頭
  const thead=document.createElement("thead");const htr=document.createElement("tr");
  const corner=document.createElement("th");corner.className="corner";corner.textContent="日期 ＼ 進出點";htr.appendChild(corner);
  routes.forEach(rt=>{const th=document.createElement("th");th.textContent=rt;htr.appendChild(th);});
  thead.appendChild(htr);t.appendChild(thead);
  // 列
  const tb=document.createElement("tbody");
  dates.forEach(d=>{
    const tr=document.createElement("tr");
    const rh=document.createElement("th");rh.className="rowh";rh.textContent=dateLabel(d);tr.appendChild(rh);
    const rowCells=routes.map(rt=>cell[d+"|"+rt]);
    const rowMin=Math.min(...rowCells.filter(c=>c&&c.price!=null).map(c=>c.price));
    routes.forEach((rt,i)=>{
      const c=rowCells[i];const td=document.createElement("td");
      if(!c){td.className="cell empty";td.textContent="—";}
      else{
        td.className="cell";
        if(c.price===rowMin)td.classList.add("rowmin");
        if(c.price===gmin)td.classList.add("gmin");
        if(sel&&sel.d===d&&sel.r===rt)td.classList.add("sel");
        td.innerHTML=`<span class="p">${FMT(c.price)}</span><span class="al">${c.airline}</span>`;
        td.onclick=()=>{sel={d,r:rt};render();document.getElementById("detail")?.scrollIntoView({behavior:"smooth",block:"nearest"});};
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);mw.appendChild(t);main.appendChild(mw);

  // 明細
  const det=document.createElement("div");det.className="detail";det.id="detail";
  if(sel){
    const list=rows.filter(r=>dateKey(r)===sel.d&&r.route===sel.r).sort((a,b)=>(a.price==null?Infinity:a.price)-(b.price==null?Infinity:b.price));
    const h=document.createElement("h2");h.textContent=`${sel.r}　${dateLabel(sel.d)}　(${list.length} 班)`;det.appendChild(h);
    const tw=document.createElement("div");tw.className="tablewrap";
    const lt=document.createElement("table");lt.className="list";
    lt.innerHTML="<thead><tr><th>價格</th><th>航空</th><th>出發</th><th>抵達</th><th>起飛</th><th>轉機</th><th>時長</th></tr></thead>";
    const ltb=document.createElement("tbody");const lo=list.find(r=>r.price!=null)?.price??-1;
    list.forEach(r=>{const[f,to]=splitRoute(r.route);const tr=document.createElement("tr");
      const stops=r.stops===0?'<span class="d0">直達</span>':(r.stops==null?'—':r.stops+" 轉");
      tr.innerHTML=`<td class="price">${FMT(r.price)}${r.price===lo?'<span class="tag">最低</span>':''}</td>`+
        `<td>${r.airline}</td><td class="num">${f}</td><td class="num">${to}</td>`+
        `<td class="num">${hhmm(r.dep_min)}</td><td>${stops}</td><td class="num">${durtxt(r.duration_min)}</td>`;
      ltb.appendChild(tr);});
    lt.appendChild(ltb);tw.appendChild(lt);det.appendChild(tw);
  }else{
    const p=document.createElement("div");p.className="hint";p.textContent="👆 點上面矩陣任一格,這裡就會列出那個日期+進出點的所有航班。";det.appendChild(p);
  }
  main.appendChild(det);
}

function setTrip(nt){
  trip=nt;sel=null;
  document.getElementById("btn-rt").setAttribute("aria-pressed",nt==="round-trip");
  document.getElementById("btn-ow").setAttribute("aria-pressed",nt==="one-way");
  buildAirlines();render();
}
async function boot(){
  buildHourSelects();
  document.getElementById("btn-rt").onclick=()=>setTrip("round-trip");
  document.getElementById("btn-ow").onclick=()=>setTrip("one-way");
  document.getElementById("direct").onchange=e=>{state.direct=e.target.checked;render();};
  document.getElementById("air-all").onclick=()=>{state.off.clear();buildAirlines();render();};
  document.getElementById("air-none").onclick=()=>{airlinesOf(DATA[trip]||[]).forEach(a=>state.off.add(a));buildAirlines();render();};
  try{DATA=await (await fetch("data.json",{cache:"no-store"})).json();}
  catch(e){document.getElementById("main").innerHTML='<div class="empty">讀不到 data.json。</div>';return;}
  document.getElementById("updated").textContent="更新於 "+(DATA["抓取時間"]||"—").replace("T"," ");
  if(!(DATA["round-trip"]||[]).length&&(DATA["one-way"]||[]).length)setTrip("one-way");else setTrip("round-trip");
}
boot();
</script>
